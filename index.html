<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#10231a;--mu:#6b7b72;--ac:#0f9d6b;--ac2:#e2f6ee;--bd:#e3eae6;--rd:#e5484d;--rd2:#fdecec;--sh:0 1px 2px rgba(16,35,26,.05),0 8px 24px rgba(16,35,26,.06);--hero:linear-gradient(135deg,#0f9d6b 0%,#0b7a8c 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--card:#14201a;--tx:#e9f2ed;--mu:#8fa398;--ac:#34d399;--ac2:#163a2c;--bd:#22322a;--rd:#ff7a7f;--rd2:#3a1c1e;--sh:0 8px 24px rgba(0,0,0,.35);--hero:linear-gradient(135deg,#0b7a55 0%,#0a5f6e 100%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1511;--card:#14201a;--tx:#e9f2ed;--mu:#8fa398;--ac:#34d399;--ac2:#163a2c;--bd:#22322a;--rd:#ff7a7f;--rd2:#3a1c1e;--sh:0 8px 24px rgba(0,0,0,.35);--hero:linear-gradient(135deg,#0b7a55 0%,#0a5f6e 100%);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--hero);display:grid;place-items:center;color:#fff}
h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:.95rem;margin:22px 2px 10px;font-weight:700;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:.8rem}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.hero{background:var(--hero);color:#fff;border:0;position:relative;overflow:hidden}
.hero .mu{color:rgba(255,255,255,.8)}
.big{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--ac2);color:var(--ac)}
.chip.up{background:var(--rd2);color:var(--rd)}
.hero .chip{background:rgba(255,255,255,.2);color:#fff}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
button:active{transform:scale(.98)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] .pri{color:#06281c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#06281c}}
.cta{width:100%;padding:14px;font-size:1rem;margin:8px 0}
.danger{color:var(--rd);border-color:var(--rd2);background:var(--rd2)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:6px;box-shadow:var(--sh);width:min(420px,calc(100% - 24px))}
nav button{flex:1;flex-direction:column;gap:2px;border:0;background:none;color:var(--mu);font-size:.62rem;padding:8px 2px;border-radius:16px}
nav button.on{background:var(--ac2);color:var(--ac)}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
label{display:block;font-size:.72rem;font-weight:600;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.it{border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0;background:var(--card)}
.bar{height:8px;background:var(--ac2);border-radius:6px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:6px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.clk{cursor:pointer}
.ic{width:40px;height:40px;border-radius:12px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;flex:none}
.err{color:var(--rd);font-size:.88rem;margin:8px 0;font-weight:600}
.hd{display:flex;gap:12px;align-items:center}.hd>div:nth-child(2){flex:1;min-width:0}
.tr{padding:7px 0;border-top:1px solid var(--bd);font-size:.85rem}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;padding:28px 12px;color:var(--mu)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:6px}
</style></head><body>

<main>
<div class="top"><div class="logo"><svg class="i"><use href="#i-cart"/></svg></div><div><h1>Meu Mercado</h1><div class="mu" id="mode">Carregando…</div></div><button onclick="sb&&sb.auth.signOut().then(()=>location.reload())" style="margin-left:auto;padding:6px 12px;font-size:.75rem">Sair</button></div>

<script>
const CATS=["Alimentação","Hortifruti","Carnes e congelados","Higiene pessoal","Limpeza","Bebidas","Doces, besteiras e lanches","Outros"];
const COL=["#0f9d6b","#16a34a","#e5484d","#7c5cff","#0ea5e9","#f59e0b","#ec4899","#64748b"];
const UN=["un","kg","g","L","ml"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const D=i=>i?i.split("-").reverse().join("/"):"";
const num=v=>parseFloat(String(v).replace(",","."))||0;
const net=i=>Math.max(0,i.qtd*i.preco-(i.desc||0));
const tot=p=>(p.items||[]).reduce((s,i)=>s+net(i),0);
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const pct=x=>Math.abs(x).toFixed(1).replace(".",",")+"%";
const SB_URL="https://fmovgftzgewxhwidnuhn.supabase.co",SB_KEY="sb_publishable_E35tEHVnObfFeegG-3qwiQ_SIQYsz8B";
let P=[],ed=null,view="home",draft=null,msg="",open={},UID=null,HID=null,HH=null,NM={},sb=null;
const who=p=>p.por?(p.por===UID?"Você":(NM[p.por]&&NM[p.por].name)||"Outra pessoa"):"";
const banner=()=>"";
const erro=m=>/Invalid login/i.test(m)?"E-mail ou senha incorretos.":/already registered/i.test(m)?"Este e-mail já tem conta. Toque em Entrar.":m;
async function init(){
  $("nav").style.display="none";
  try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){$("#mode").textContent="Não foi possível carregar o Supabase. Verifique a internet.";return}
  const{data:{session}}=await sb.auth.getSession();
  if(session){UID=session.user.id;await boot()}else authView();
}
function authView(m){
  $("#mode").textContent="Entre para ver as compras da casa";
  $("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">Entrar</h2><label>E-mail</label><input id="a-mail" type="email" autocomplete="email"><label>Senha (mínimo 6 caracteres)</label><input id="a-pw" type="password" autocomplete="current-password"><div class="err">${esc(m||"")}</div><button class="pri cta" onclick="doAuth(false)">Entrar</button><button class="cta" onclick="doAuth(true)">Criar conta</button></div>`;
}
async function doAuth(sign){
  const email=$("#a-mail").value.trim(),password=$("#a-pw").value;
  if(!email||password.length<6)return authView("Informe o e-mail e uma senha com 6 ou mais caracteres.");
  const r=sign?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return authView(erro(r.error.message));
  if(!r.data.session)return authView("Conta criada. Confirme o e-mail que enviamos e depois toque em Entrar.");
  UID=r.data.session.user.id;await boot();
}
async function boot(){
  const{data,error}=await sb.from("members").select("household_id,households(name,invite_code)").eq("user_id",UID).limit(1);
  if(error)return authView("Erro ao carregar os dados: "+error.message);
  if(!data.length)return houseView();
  HID=data[0].household_id;HH=data[0].households;
  $("nav").style.display="flex";await load();
}
function houseView(m){
  $("#mode").textContent="Falta escolher a casa";
  $("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">Sua casa</h2><div class="mu">Uma pessoa cria a casa e a outra entra com o código de convite.</div><label>Seu nome</label><input id="h-nome"><label>Nome da casa (para criar)</label><input id="h-casa" placeholder="Nossa casa"><button class="pri cta" onclick="mkHouse()">Criar casa</button><label>Ou código de convite</label><input id="h-code"><div class="err">${esc(m||"")}</div><button class="cta" onclick="joinHouse()">Entrar na casa</button></div>`;
}
async function mkHouse(){const n=$("#h-nome").value.trim();if(!n)return houseView("Informe seu nome.");
  const{error}=await sb.rpc("create_household",{p_name:$("#h-casa").value.trim()||"Nossa casa",p_display:n});if(error)return houseView(error.message);await boot()}
async function joinHouse(){const n=$("#h-nome").value.trim(),c=$("#h-code").value.trim();if(!n||!c)return houseView("Informe seu nome e o código.");
  const{error}=await sb.rpc("join_household",{p_code:c,p_display:n});if(error)return houseView(/inv[aá]lido/i.test(error.message)?"Código de convite inválido.":error.message);await boot()}
async function pages(t){let o=[],f=0;for(;;){const{data,error}=await sb.from(t).select("*").eq("household_id",HID).order("id").range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;f+=1000}return o}
async function load(){
  try{
    const[pu,it,me]=await Promise.all([pages("purchases"),pages("purchase_items"),sb.from("members").select("user_id,display_name").eq("household_id",HID)]);
    NM={};(me.data||[]).forEach(m=>NM[m.user_id]={name:m.display_name||"Outra pessoa"});
    const by={};it.forEach(x=>(by[x.purchase_id]=by[x.purchase_id]||[]).push({nome:x.name,marca:x.brand||"",emb:Number(x.pack_size)||0,un:x.unit,qtd:Number(x.qty),preco:Number(x.unit_price),desc:Number(x.discount),cat:x.category}));
    P=pu.map(p=>({id:p.id,date:p.purchased_on,store:p.store,key:p.access_key||"",por:p.user_id,items:by[p.id]||[]}));
    await loadPlan();
    $("#mode").textContent=HH.name+" · código de convite: "+HH.invite_code;
  }catch(e){$("#mode").textContent="Erro ao carregar: "+(e.message||e)}
  render();
}
async function save(d){
  if(d.key&&P.some(x=>x.key===d.key&&x.id!==ed))return"dup";
  const row={household_id:HID,purchased_on:d.date,store:d.store,access_key:d.key||null,total:d.total};
  let id=ed;
  if(id){const a=await sb.from("purchases").update(row).eq("id",id);if(a.error)throw a.error;const b=await sb.from("purchase_items").delete().eq("purchase_id",id);if(b.error)throw b.error}
  else{const{data,error}=await sb.from("purchases").insert({...row,user_id:UID}).select("id").single();if(error){if(error.code==="23505")return"dup";throw error}id=data.id}
  const rows=d.items.map(i=>({purchase_id:id,household_id:HID,name:i.nome,brand:i.marca||null,pack_size:i.emb||null,unit:i.un,qty:i.qtd,unit_price:i.preco,discount:i.desc||0,category:i.cat}));
  const c=await sb.from("purchase_items").insert(rows);if(c.error)throw c.error;
  await load();return"ok";
}
async function remove(id){const{error}=await sb.from("purchases").delete().eq("id",id);if(error)throw error;await load()}
const mk=d=>d.slice(0,7);
function prevMonth(m){let[y,mo]=m.split("-").map(Number);mo--;if(!mo){mo=12;y--}return y+"-"+String(mo).padStart(2,"0")}
const mname=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
const mshort=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".","")};

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $("#app").innerHTML=view==="home"?home():view==="list"?list():view==="prod"?prods():view==="plano"?planoView():view==="qr"?qrView():view==="foto"?fotoView():form();
  if(view==="form")bindForm();
}
function go(v,id){stopQR();QRLINK="";BUSCA="";IMP=null;view=v;ed=id||null;draft=null;msg="";render();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const empty=(t,b)=>`<div class="card empty">${ic("cart")}<div>${t}</div>${b||""}</div>`;

function chart(months,vals){
  const mx=Math.max(...vals,1),W=300,H=120,bw=34,gap=(W-bw*months.length)/(months.length+1);
  return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto">`+months.map((m,i)=>{
    const h=vals[i]/mx*H,x=gap+i*(bw+gap),last=i===months.length-1;
    return `<rect x="${x}" y="${H-h}" width="${bw}" height="${Math.max(h,2)}" rx="8" fill="${last?"var(--ac)":"var(--ac2)"}"/><text x="${x+bw/2}" y="${H+15}" text-anchor="middle" font-size="10" fill="var(--mu)">${mshort(m)}</text>`}).join("")+`</svg>`;
}
let IGN={};try{IGN=JSON.parse(localStorage.getItem("meumercado_ignorados")||"{}")}catch(e){}
function ignorar(k){IGN[decodeURIComponent(k)]=1;try{localStorage.setItem("meumercado_ignorados",JSON.stringify(IGN))}catch(e){}render()}
function esquecidos(){
  const m={},hoje=new Date();hoje.setHours(0,0,0,0);
  P.forEach(p=>(p.items||[]).forEach(i=>{const k=[i.nome,i.marca,i.emb,i.un].map(x=>String(x||"").toLowerCase().trim()).join("|");const o=m[k]=m[k]||{k,i,d:new Set()};o.i=i;if(p.date)o.d.add(p.date)}));
  const out=[];
  Object.values(m).forEach(o=>{
    const ds=[...o.d].sort();if(ds.length<2)return;
    const t=ds.map(x=>new Date(x+"T00:00:00").getTime());let s=0;
    for(let j=1;j<t.length;j++)s+=(t[j]-t[j-1])/864e5;
    const avg=s/(t.length-1),since=Math.round((hoje-t[t.length-1])/864e5),last=ds[ds.length-1];
    if(avg<1||IGN[o.k+"|"+last])return;
    if(since>=7&&since>avg*1.25)out.push({k:o.k,i:o.i,n:ds.length,avg:Math.round(avg),since,last,r:since/avg});
  });
  return out.sort((a,b)=>b.r-a.r);
}
function alerta(){
  const L=esquecidos();if(!L.length)return"";
  return `<div class="card" style="border-color:var(--rd)"><b style="display:flex;gap:8px;align-items:center;color:var(--rd)">${ic("bell")}Pode ter esquecido (${L.length})</b><div class="mu" style="margin:4px 0 6px">Itens que você costuma comprar e que estão atrasados.</div>${L.slice(0,8).map(o=>`<div class="tr fl"><span>${esc(o.i.nome)}${o.i.marca?" · "+esc(o.i.marca):""}<div class="mu">Comprado ${o.n}x, em média a cada ${o.avg} dias · última vez em ${D(o.last)} (há ${o.since} dias)</div></span><button style="padding:6px 10px;font-size:.75rem" onclick="ignorar('${encodeURIComponent(o.k+"|"+o.last)}')">Ignorar</button></div>`).join("")}${L.length>8?`<div class="mu" style="margin-top:6px">+${L.length-8} outros itens</div>`:""}</div>`;
}
let selM="",BUSCA="",META=0;try{META=Number(localStorage.getItem("meumercado_meta"))||0}catch(e){}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const nextMonth=m=>{let[y,mo]=m.split("-").map(Number);mo++;if(mo>12){mo=1;y++}return y+"-"+String(mo).padStart(2,"0")};
function seletor(cur,nowM){return `<div class="fl" style="margin-bottom:10px"><button onclick="mudaMes(-1)" aria-label="Mês anterior">‹</button><b style="text-transform:capitalize">${mname(cur)}</b><button onclick="mudaMes(1)" ${cur>=nowM?'disabled style="opacity:.4"':""} aria-label="Próximo mês">›</button></div>`}
function mudaMes(d){const n=new Date(),nowM=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");let m=selM||nowM;m=d<0?prevMonth(m):nextMonth(m);if(m>nowM)return;selM=m===nowM?"":m;render()}
function metaHtml(ta){
  if(!META)return `<div style="margin-top:10px"><button style="padding:6px 12px;font-size:.78rem" onclick="defMeta()">Definir meta mensal</button></div>`;
  const p=ta/META*100;
  return `<div style="margin-top:10px"><div class="fl mu"><span>Meta ${R(META)}</span><span>${p.toFixed(0)}%${ta>META?" · passou "+R(ta-META):" · restam "+R(META-ta)}</span></div><div class="bar" style="background:rgba(255,255,255,.25)"><i style="width:${Math.min(100,p)}%;background:${ta>META?"#ffb4b4":"#fff"}"></i></div><button style="padding:4px 10px;font-size:.72rem" onclick="defMeta()">Alterar meta</button></div>`;
}
const keyOf=i=>[i.nome,i.marca,i.emb,i.un].map(x=>String(x||"").toLowerCase().trim()).join("|");
function habExtras(cur){
  const meses=[];let m=cur;for(let k=0;k<3;k++){m=prevMonth(m);meses.push(m)}
  const nomes={},cnt={};
  meses.forEach(mm=>{const set=new Set();P.filter(p=>mk(p.date||"")===mm).forEach(p=>(p.items||[]).forEach(i=>{const k=keyOf(i);set.add(k);nomes[k]=i}));set.forEach(k=>cnt[k]=(cnt[k]||0)+1)});
  const comDados=meses.filter(mm=>P.some(p=>mk(p.date||"")===mm)).length;

function enhance(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    const k=Math.min(1,2600/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement("canvas");
    c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    const d=x.getImageData(0,0,w,h),a=d.data,hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4){const g=Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2]);a[i]=a[i+1]=a[i+2]=g;hist[g]++}
    const tot=w*h;let lo=0,hi=255,s=0;
    for(let i=0;i<256;i++){s+=hist[i];if(s>=tot*.02){lo=i;break}}
    s=0;for(let i=255;i>=0;i--){s+=hist[i];if(s>=tot*.02){hi=i;break}}
    if(hi-lo<30){lo=0;hi=255}
    const lut=new Uint8ClampedArray(256);for(let i=0;i<256;i++)lut[i]=Math.max(0,Math.min(255,(i-lo)/(hi-lo)*255));
    for(let i=0;i<a.length;i+=4){const v=lut[a[i]];a[i]=a[i+1]=a[i+2]=v}
    x.putImageData(d,0,0);res(c.toDataURL("image/jpeg",.9));
  };
  img.onerror=()=>rej(new Error("Não foi possível abrir a foto"));img.src=u})}

}

async function pasteClip(){
  try{
    const t=await Promise.race([navigator.clipboard.readText(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),4000))]);
    if(!t||!t.trim()){IMP={tipo:"erro",texto:"Não há nada copiado. Copie o texto do cupom e tente de novo."};draft=readForm();render();return}
    $("#f-paste").value=t;importCupom();
  }catch(e){
    PASTE=($("#f-paste")||{}).value||"";draft=readForm();
    IMP={tipo:"erro",texto:"O navegador não deixou ler o que você copiou. Toque no campo de texto, segure o dedo, escolha Colar, e depois toque em Importar itens."};render();
  }
}
function importCupom(force){
  const txt=$("#f-paste").value,cur=readForm();PASTE=txt;
  if(!txt.trim()){draft=cur;IMP={tipo:"erro",texto:"Cole primeiro o texto do cupom no campo."};render();return}
  const r=parseCupom(txt,force===true);
  if(r.error){draft=cur;IMP={tipo:"erro",texto:r.error,forcar:!!r.mismatch};render();scrollTo(0,0);return}
  draft={date:r.date||cur.date,store:cur.store||r.store,key:cur.key||r.key,items:r.items};
  IMP={tipo:"ok",texto:"Importado: "+r.items.length+" itens, total "+R(r.total)+(r.desc?" (desconto de "+R(r.desc)+" dividido entre os itens)":"")+"."+(r.aviso?" Atenção: "+r.aviso:" Conferido com o total do cupom.")+" Confira a data, o supermercado e as categorias e salve."};
  PASTE="";render();scrollTo(0,0);
}
const PROMPT_IA=`Leia a(s) foto(s) deste cupom fiscal (NFC-e) e responda SOMENTE com um JSON, sem explicações e sem formatação extra, neste formato:
{"mercado":"nome do mercado","data":"AAAA-MM-DD","chave":"44 dígitos, se aparecer","valor_total":0.00,"desconto_total":0.00,"itens":[{"nome":"nome do produto","qtd":1,"un":"un ou kg","preco":0.00,"total":0.00,"desconto":0.00}]}
Regras: use ponto como separador decimal. "preco" é o valor unitário e "total" é o valor total do item, como impressos no cupom (antes de descontos). "valor_total" é o valor total do cupom antes do desconto. Inclua TODOS os itens, na ordem do cupom. Se não conseguir ler algum número com certeza, escreva "ILEGIVEL" no lugar. Nunca invente nem estime valores.`;
function parseJSONCupom(s){
  let o;try{o=JSON.parse(s)}catch(e){return{error:"O texto parece JSON, mas tem erro de formato. Peça à IA para gerar de novo, só com o JSON."}}
  const L=Array.isArray(o.itens)?o.itens:[];
  if(!L.length)return{error:"Não encontrei a lista de itens (campo \"itens\")."};
  const it=[];
  for(let k=0;k<L.length;k++){
    const x=L[k]||{},n=k+1,nome=String(x.nome||"").trim(),qtd=Number(x.qtd),preco=Number(x.preco),tot=Number(x.total),desc=Number(x.desconto||0);
    if(!nome||!(qtd>0)||!(preco>=0)||!(tot>=0)||isNaN(desc))return{error:`Item ${n} (${nome||"sem nome"}): faltam nome, quantidade, preço ou total, ou algum número está ilegível. Nada foi importado.`};
    if(Math.abs(qtd*preco-tot)>0.02)return{error:`Item ${n} (${nome}): ${qtd} × ${R(preco)} dá ${R(qtd*preco)}, mas o total informado é ${R(tot)}. Algum número foi lido errado. Nada foi importado.`};
    const un=String(x.un||"un").toLowerCase();
    const ue=String(x.un_emb||"").toLowerCase(),emb=Number(x.emb)||0,mu=v=>v==="l"?"L":v;
    it.push({nome,marca:String(x.marca||"").trim(),emb:ue&&emb?emb:0,un:ue&&emb&&["kg","g","l","ml"].includes(ue)?mu(ue):(["kg","g","l","ml"].includes(un)?mu(un):"un"),qtd,preco,desc,cat:CATS.includes(x.categoria)?x.categoria:guessCat(nome),_t:tot});
  }
  const total=Number(o.valor_total),soma=Math.round(it.reduce((a,i)=>a+i._t,0)*100)/100;
  if(!(total>0))return{error:"Falta o valor total do cupom (\"valor_total\") para conferir os itens."};
  if(Math.abs(soma-total)>0.01)return{error:`A soma dos itens (${R(soma)}) não bate com o valor total do cupom (${R(total)}). Nada foi importado.`};
  const dt=Number(o.desconto_total||0),ds=Math.round(it.reduce((a,i)=>a+i.desc,0)*100)/100;
  if(dt>0&&ds===0){let rest=dt;it.forEach((i,k)=>{const d=k===it.length-1?rest:Math.round(i._t/soma*dt*100)/100;i.desc=Math.min(d,i._t);rest=Math.round((rest-i.desc)*100)/100})}
  else if(dt>0&&Math.abs(ds-dt)>0.01)return{error:`Os descontos dos itens (${R(ds)}) não batem com o desconto total (${R(dt)}). Nada foi importado.`};
  it.forEach(i=>delete i._t);
  const key=String(o.chave||"").replace(/\D/g,"");
  return{items:it,total,desc:dt||ds,store:String(o.mercado||"").trim().slice(0,60),date:/^\d{4}-\d{2}-\d{2}$/.test(o.data||"")?o.data:"",key:key.length===44?key:""};
}
async function copyPrompt(){try{await navigator.clipboard.writeText(PROMPT_IA);alert("Instruções copiadas. Cole na IA junto com a foto do cupom.")}catch(e){prompt("Copie estas instruções:",PROMPT_IA)}}
function loadFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#f-paste").value=String(r.result||"");importCupom()};r.readAsText(f)}
init();
